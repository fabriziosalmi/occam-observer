name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends jq sqlite3 inotify-tools
          sudo apt-get install -y --no-install-recommends python3

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: "Smoke: engine syntax"
        run: bash -n telemetry_observer.sh

      - name: "Smoke: shipped config validates"
        run: ./telemetry_observer.sh --validate

      - name: go vet + test + build (api)
        working-directory: api
        run: |
          go vet ./...
          go test ./...
          go build -o /tmp/occam-api .

      - name: go vet + build (mcp)
        working-directory: mcp
        run: |
          go vet ./...
          go build -o /tmp/occam-mcp .

      - name: Run test suite
        run: ./run_tests.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t occam-observer:ci .
      - name: "Smoke: published port + mounted repo owned by another uid"
        run: scripts/docker-smoke.sh occam-observer:ci

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
